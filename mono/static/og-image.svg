<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b10" />
      <stop offset="1" stop-color="#060608" />
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#4f46e5" stop-opacity="0.42" />
      <stop offset="0.6" stop-color="#4f46e5" stop-opacity="0.06" />
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0" />
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#6366f1" fill-opacity="0.16" />
    </pattern>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1" />
      <stop offset="1" stop-color="#4f46e5" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#dots)" />
  <rect width="1200" height="630" fill="url(#halo)" />

  <!-- logomark -->
  <g transform="translate(516, 150)">
    <rect width="80" height="80" rx="20" fill="url(#mark)" />
    <g transform="translate(40, 40)">
      <circle cx="0" cy="0" r="26" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.4" />
      <circle cx="0" cy="-16" r="6" fill="#ffffff" />
      <circle cx="14" cy="9" r="6" fill="#ffffff" opacity="0.8" />
      <circle cx="-14" cy="9" r="6" fill="#ffffff" opacity="0.8" />
    </g>
    <text x="100" y="58" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
      font-size="76" font-weight="700" letter-spacing="-3" fill="#ffffff">TAO</text>
  </g>

  <!-- tagline -->
  <text x="600" y="350" text-anchor="middle"
    font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
    font-size="34" font-weight="500" fill="#d4d4d8">Exams, end to end.</text>
  <text x="600" y="398" text-anchor="middle"
    font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
    font-size="26" font-weight="400" fill="#8b8b94">Import, forge, run and export — all in one place.</text>

  <!-- eyebrow pill -->
  <g transform="translate(600, 470)">
    <rect x="-118" y="0" width="236" height="44" rx="22" fill="#ffffff" fill-opacity="0.05"
      stroke="#ffffff" stroke-opacity="0.12" />
    <circle cx="-86" cy="22" r="5" fill="#34d399" />
    <text x="-70" y="29" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
      font-size="19" font-weight="600" letter-spacing="1" fill="#a1a1aa">lv0.eu · exam suite</text>
  </g>
</svg>
